<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.35.5/apexcharts.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://cdn.iconscout.com/icon/free/png-512/free-leetcode-logo-icon-download-in-svg-png-gif-file-formats--technology-social-media-company-vol-1-pack-logos-icons-3030025.png?f=webp&w=256" type="image/x-icon">
    <title>LeetCode-Roaster</title>
</head>


<body>
    <div class="container">
        <h1 class="heading">LeetCode-Roaster 🔥</h1>
        
        <div class="search-container">
            <input type="text" placeholder="Enter your LeetCode username">
            <button type="submit">Submit</button>
        </div>
        
        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-title">Problem Distribution</div>
                <canvas class="my-chart"></canvas>
            </div>
            
            <div class="chart-card">
                <div class="chart-title">Acceptance Rate</div>
                <div id="chart"></div>
            </div>
        </div>
        
        <div class="roast-container hidden">
            <div class="roast"></div>
        </div>
        
        <div class="share-buttons hidden">
            <button id="shareButtonL">Share on LinkedIn</button>
            <button id="shareButtonT">Share on Twitter</button>
        </div>
    </div>
</body>
<script src="script.js"></script>


</html>
